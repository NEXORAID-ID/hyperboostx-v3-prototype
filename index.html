function metric(l,v,u,n=0){return `<div class="card"><div class="micro">${esc(l)}</div><div class="value">${esc(v)} <small>${esc(u)}</small></div><div class="spark">ILLUSTRATIVE VALUE</div><div class="bar"><i style="width:${Math.max(0,Math.min(n,100))}%"></i></div></div>`}function chart(label='Demo trend',a=[42,49,32,55,43,71,56,60,45,71,52,66,43,59,49,64],b=[22,28,20,35,27,45,29,44,33,50,36,44,27,42,31,38]){let points=x=>x.map((v,i)=>`${i*560/(x.length-1)},${142-v*1.25}`).join(' ');return `<svg class="chart" viewBox="0 0 590 166" role="img" aria-label="${esc(label)}: illustrative sample, not measured"><defs><linearGradient id="fill-${current}" x2="0" y2="1"><stop stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><g transform="translate(20,4)">${[17,48,79,110,141].map((y,i)=>`<path d="M0 ${y}H560" stroke="var(--line)" stroke-dasharray="4 4"/><text x="-4" y="${y+3}" text-anchor="end" font-size="8" fill="var(--muted)">${100-i*25}</text>`).join('')}<polygon points="0,142 ${points(a)} 560,142" fill="url(#fill-${current})"/><polyline points="${points(a)}" stroke="var(--accent)" fill="none" stroke-width="2.5"/><polyline points="${points(b)}" stroke="var(--accent2)" fill="none" stroke-width="1.8"/><text x="0" y="159" fill="var(--muted)" font-size="9">−60s</text><text x="560" y="159" text-anchor="end" fill="var(--muted)" font-size="9">Now</text></g></svg>`}
const card=(title,body,sub='')=>`<section class="card"><div class="spread"><h2>${esc(title)}</h2>${sub}</div>${body}</section>`;const section=t=>`<div class="section">${esc(t)}</div>`;const action=(label,detail=label)=>`<button data-preview="${esc(detail)}">${esc(label)}</button>`;const lines=rows=>rows.map(r=>`<div class="line"><div><b>${esc(r[0])}</b>${r[1]?`<small>${esc(r[1])}</small>`:''}</div><span class="pill">${esc(r[2]||'Not evaluated')}</span></div>`).join('');
